<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PDF/文档签章排版工具">
  <title>PDF/文档签章排版工具</title>
  <desc>文档纸与倾斜红色印章</desc>
  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#5b9cff"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- 图标底：圆角方块 + 蓝色渐变 -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#iconBg)" />

  <!-- 文档纸 -->
  <path d="M16 10h16l11 11v28a5 5 0 0 1-5 5H16a5 5 0 0 1-5-5V15a5 5 0 0 1 5-5z" fill="#ffffff" />
  <path d="M32 10l11 11H37a5 5 0 0 1-5-5z" fill="#cfdcf5" />
  <g fill="#c2d0e6">
    <rect x="16" y="28" width="15" height="3.2" rx="1.6" />
    <rect x="16" y="35" width="13" height="3.2" rx="1.6" />
    <rect x="16" y="42" width="16" height="3.2" rx="1.6" />
  </g>

  <!-- 印章：逆时针微倾，外圈 + 内环 + 五角星 -->
  <g transform="rotate(-12 42 44)">
    <circle cx="42" cy="44" r="13.5" fill="#e02424" />
    <circle cx="42" cy="44" r="10.1" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.9" />
    <path d="M42 37.2 43.7 41.7 48.5 41.9 44.8 44.9 46 49.5 42 46.9 38 49.5 39.2 44.9 35.5 41.9 40.3 41.7Z" fill="#ffffff" />
  </g>
</svg>
